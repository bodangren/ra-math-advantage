name: Monorepo CI Matrix

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - ".gitignore"
  pull_request:
    paths-ignore:
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 1: Package validation (runs in parallel)
  packages:
    name: Validate Packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - activity-components
          - activity-runtime
          - ai-tutoring
          - app-shell
          - component-approval
          - core-auth
          - core-convex
          - efficacy-core
          - graphing-core
          - knowledge-space-core
          - knowledge-space-practice
          - lesson-renderer
          - math-content
          - practice-core
          - practice-test-engine
          - rate-limiter
          - srs-engine
          - study-hub-core
          - teacher-reporting-core
          - workbook-pipeline
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run package tests
        run: npm run test --workspace=packages/${{ matrix.package }}

      - name: Run generator correctness gate
        if: matrix.package == 'practice-core'
        run: npm run test:generators --workspace=packages/practice-core
        env:
          CI: true

      - name: Run package typecheck
        run: npm run typecheck --workspace=packages/${{ matrix.package }}

      - name: Run package lint
        run: npm run lint --workspace=packages/${{ matrix.package }}

  # Phase 2: Boundary guard checks (runs after packages)
  boundary-check:
    name: Boundary Guard Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: npm run format:check
        env:
          CI: true

      - name: Run monorepo boundary check
        run: node scripts/check-monorepo-boundaries.mjs
        env:
          CI: true

      - name: Verify root and CI workspace parity
        run: node scripts/architecture/check-quality-parity.mjs
        env:
          CI: true

  # Phase 3: IM3 app gates
  im3:
    name: IM3 App Gates
    runs-on: ubuntu-latest
    needs: [packages, boundary-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run IM3 lint
        run: npm run lint --prefix apps/integrated-math-3
        env:
          CI: true

      - name: Run IM3 tests
        run: npm test --prefix apps/integrated-math-3
        env:
          CI: true

      - name: Run IM3 typecheck
        run: npm run typecheck --workspace=apps/integrated-math-3
        env:
          CI: true

      - name: Run IM3 build
        run: npm run build --prefix apps/integrated-math-3
        env:
          CI: true

      - name: Run IM3 bundle size audit
        run: npm run bundle-size:audit --prefix apps/integrated-math-3
        env:
          CI: true

  # Phase 4: BM2 app gates
  # BM2 TypeScript errors and governance test failures resolved (review-18).
  # All BM2 gates now block CI on failure.
  bm2:
    name: BM2 App Gates
    runs-on: ubuntu-latest
    needs: [packages, boundary-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run BM2 lint
        run: npm run lint --workspace=apps/bus-math-v2
        env:
          CI: true

      - name: Run BM2 tests
        run: npm run test --workspace=apps/bus-math-v2
        env:
          CI: true

      - name: Run BM2 build
        run: npm run build --workspace=apps/bus-math-v2
        env:
          CI: true

      - name: Run BM2 typecheck
        run: npm run typecheck --workspace=apps/bus-math-v2
        env:
          CI: true

      - name: Run BM2 bundle size audit
        run: npm run bundle:audit --workspace=apps/bus-math-v2
        env:
          CI: true

  # Phase 4b: E2E tests for IM3 (after IM3 gates pass)
  # Flake budget: retries=1 in CI
  e2e-im3:
    # Flake budget: retries=1 in CI
    name: E2E IM3
    runs-on: ubuntu-latest
    needs: [im3]
    env:
      CI: true
      PLAYWRIGHT_RETRIES: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run IM3 viewport guard smoke
        run: npx playwright test --config=apps/integrated-math-3/playwright.config.ts --project=viewport e2e/viewport-guard.spec.ts -g "@smoke" --workers 1
        env:
          CI: true

      - name: Run IM3 E2E suite
        run: npm run test:e2e --prefix apps/integrated-math-3

  # Phase 5: IM1, IM2, PreCalc, and Danielson app gates
  # Apps share the same step structure; matrix deduplicates the config.
  app-foundations:
    name: ${{ matrix.app.name }} App Gates
    runs-on: ubuntu-latest
    needs: [packages, boundary-check]
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: IM1, prefix: apps/integrated-math-1, dir: apps/integrated-math-1 }
          - { name: IM2, prefix: apps/integrated-math-2, dir: apps/integrated-math-2 }
          - { name: PreCalc, prefix: apps/pre-calculus, dir: apps/pre-calculus }
          - { name: Danielson, prefix: apps/danielson, dir: apps/danielson }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.app.name }} lint
        run: npm run lint --prefix ${{ matrix.app.prefix }}
        env:
          CI: true

      - name: Run ${{ matrix.app.name }} typecheck
        run: npm run typecheck --workspace=${{ matrix.app.dir }}
        env:
          CI: true

      - name: Check IM2 backend types and content bundle
        if: matrix.app.name == 'IM2'
        run: npm run typecheck --workspace=apps/integrated-math-2 && npm run curriculum:check
        env:
          CI: true

      - name: Run ${{ matrix.app.name }} build
        run: npm run build --prefix ${{ matrix.app.prefix }}
        env:
          CI: true

      - name: Run ${{ matrix.app.name }} tests
        run: npm test --prefix ${{ matrix.app.prefix }}
        env:
          CI: true
