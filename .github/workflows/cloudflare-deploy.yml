name: Cloudflare Deploy

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run monorepo boundary check
        run: node scripts/check-monorepo-boundaries.mjs
        env:
          CI: true

      - name: Run lint
        run: npm run lint --prefix apps/integrated-math-3
        env:
          CI: true

      - name: Run tests
        run: npm test --prefix apps/integrated-math-3
        env:
          CI: true

      - name: Run typecheck
        run: npm run typecheck --workspace=apps/integrated-math-3
        env:
          CI: true

      - name: Run build
        run: npm run build --prefix apps/integrated-math-3
        env:
          CI: true

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
          env: production
          workingDirectory: apps/integrated-math-3

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Cloudflare production deployment failed. Check the logs above."
